# AWS Amplify Hosting — connect the repo and set the app root to
# `examples/basic` when deploying from the sitelo monorepo.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# For plain S3 + CloudFront: `npm run build` then sync `dist/` to the bucket.
