# Your own server with nginx: a server block for /etc/nginx/conf.d/. Copy the
# build over with `rsync -a --delete dist/ you@server:/var/www/my-site/`, then
# add HTTPS with certbot. Clean URLs and 404.html (status 404) as elsewhere.
server {
  listen 80;
  server_name example.com;
  root /var/www/my-site;

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}
