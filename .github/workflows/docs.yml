name: Deploy docs

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

      # Scores the English pages against the thresholds in
      # docs/sitelo.config.js, before anything is published. lighthouse is
      # a devDependency, so `npm ci` above already installed it, and the
      # runner image ships the Chrome it drives.
      - run: npm run docs:lighthouse

      # Temporary: the audit costs ~4s a page locally and ~56s here, and
      # Lighthouse's own phase timings say where that goes. Runs even when
      # the audit fails, since a failing run is the interesting one.
      - name: Where the audit spent its time
        if: always()
        run: node docs/scripts/lighthouse-timing.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
