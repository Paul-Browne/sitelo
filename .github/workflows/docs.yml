name: Deploy docs

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each page's sitemap <lastmod> and dateModified come
          # from its last commit (docs/src/lib/last-modified.js). A shallow
          # clone has one commit to go on, so the build leaves dates out.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

      # Scores the English pages against the thresholds in
      # docs/sitelo.config.js, before anything is published. lighthouse is
      # a devDependency, so `npm ci` above already installed it, and the
      # runner image ships the Chrome it drives.
      - run: npm run docs:lighthouse

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
