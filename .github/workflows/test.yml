name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Floor and current releases of the range in `engines.node`
        # (^20.19.0 || >=22.12.0), which tracks bundled Vite 8.
        node-version: ['20.19', '22.12', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm test

  # sharp and pagefind are optional peers, and that declaration is
  # load-bearing: drop it and only Yarn Berry's Plug'n'Play linker breaks,
  # while npm and pnpm keep working. So exercise every manager for real.
  optional-peers:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, yarn-berry]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm
        if: matrix.manager == 'pnpm'
        run: corepack prepare pnpm@latest --activate

      - name: ${{ matrix.manager }}
        run: ./.github/scripts/test-package-manager.sh ${{ matrix.manager }}
